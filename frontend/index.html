<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbumRate - Rate Your Favorite Music Albums</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Toastr CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#home">
                <i class="bi bi-vinyl-fill"></i> AlbumRate
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#search">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#top-rated">Top Rated</a>
                    </li>

                </ul>
                <ul class="navbar-nav ms-auto" id="auth-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#login">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#register">Register</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto d-none" id="user-nav">
                    <li class="nav-item d-none" id="admin-nav-item">
                        <a class="nav-link" href="#admin"><i class="bi bi-gear-fill"></i> Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#profile"><i class="bi bi-person-circle"></i> Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logout-btn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Area (SPA Container) -->
    <main id="spapp" class="container-fluid">
        <section id="home" data-load="home.html"></section>
        <section id="login" data-load="login.html"></section>
        <section id="register" data-load="register.html"></section>
        <section id="search" data-load="search.html"></section>
        <section id="profile" data-load="profile.html"></section>
        <section id="top-rated" data-load="top-rated.html"></section>
        <section id="album" data-load="album-details.html"></section>
        <section id="admin" data-load="admin.html"></section>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p>&copy; 2024 AlbumRate. Rate and discover amazing music albums.</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- jQuery Validation -->
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
    <!-- Toastr for notifications -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <!-- Utils -->
    <script src="utils/constants.js"></script>
    <script src="utils/utils.js"></script>
    <!-- Services -->
    <script src="services/Users.js"></script>
    <script src="services/Albums.js"></script>
    <script src="services/Tracks.js"></script>
    <script src="services/Reviews.js"></script>
    <script src="services/Ratings.js"></script>
    <script src="services/Favorites.js"></script>
    <!-- Spapp Router -->
    <script src="js/jquery.spapp.js"></script>
    <!-- App Logic -->
    <script src="js/auth.js"></script>
    <script src="js/albums.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
