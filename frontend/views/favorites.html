<!DOCTYPE html>
<div class="container my-5">
    <div class="row">
        <div class="col-12">
            <h1 class="mb-4"><i class="bi bi-heart-fill text-danger"></i> My Favorite Albums</h1>
            <p class="lead">Your collection of favorite albums</p>
        </div>
    </div>

    <!-- Favorites Count -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="alert alert-info">
                <i class="bi bi-info-circle"></i> You have <strong id="favorites-count">0</strong> favorite albums
            </div>
        </div>
    </div>

    <!-- Favorites Grid -->
    <div class="row" id="favorites-grid">
        <div class="col-12 text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Loading your favorites...</p>
        </div>
    </div>

    <!-- Empty State -->
    <div class="row d-none" id="favorites-empty">
        <div class="col-12 text-center py-5">
            <i class="bi bi-heart display-1 text-muted"></i>
            <h3 class="mt-3">No Favorites Yet</h3>
            <p class="text-muted">Start adding albums to your favorites to see them here!</p>
            <a href="#search" class="btn btn-primary">
                <i class="bi bi-search"></i> Search Albums
            </a>
        </div>
    </div>
</div>
