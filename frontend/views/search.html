<div class="search-view">
    <div class="container mt-4">
        <!-- Search Header -->
        <div class="search-header mb-4">
            <h1 class="mb-4">
                <i class="bi bi-search"></i> Search Albums
            </h1>

            <div class="row">
                <div class="col-md-8">
                    <div class="input-group input-group-lg mb-3">
                        <input type="text" class="form-control" id="search-input"
                               placeholder="Search for albums, artists, or genres...">
                        <button class="btn btn-primary" type="button" id="search-btn">
                            <i class="bi bi-search"></i> Search
                        </button>
                    </div>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-secondary btn-lg w-100" type="button"
                            data-bs-toggle="collapse" data-bs-target="#filterCollapse">
                        <i class="bi bi-funnel"></i> Filters
                    </button>
                </div>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="collapse mb-4" id="filterCollapse">
            <div class="card card-body">
                <h5 class="mb-3">Filter Results</h5>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="filter-genre" class="form-label">Genre</label>
                        <select class="form-select" id="filter-genre">
                            <option value="">All Genres</option>
                            <option value="rock">Rock</option>
                            <option value="pop">Pop</option>
                            <option value="hiphop">Hip Hop</option>
                            <option value="electronic">Electronic</option>
                            <option value="jazz">Jazz</option>
                            <option value="classical">Classical</option>
                            <option value="country">Country</option>
                            <option value="rnb">R&B</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="filter-year" class="form-label">Year</label>
                        <select class="form-select" id="filter-year">
                            <option value="">Any Year</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                            <option value="2022">2022</option>
                            <option value="2021">2021</option>
                            <option value="2020">2020</option>
                            <option value="2010s">2010s</option>
                            <option value="2000s">2000s</option>
                            <option value="1990s">1990s</option>
                            <option value="1980s">1980s</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="filter-rating" class="form-label">Minimum Rating</label>
                        <select class="form-select" id="filter-rating">
                            <option value="">Any Rating</option>
                            <option value="9">9+ Stars</option>
                            <option value="8">8+ Stars</option>
                            <option value="7">7+ Stars</option>
                            <option value="6">6+ Stars</option>
                            <option value="5">5+ Stars</option>
                        </select>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" id="apply-filters-btn">
                        <i class="bi bi-check-circle"></i> Apply Filters
                    </button>
                    <button class="btn btn-outline-secondary" id="clear-filters-btn">
                        <i class="bi bi-x-circle"></i> Clear Filters
                    </button>
                </div>
            </div>
        </div>

        <!-- Sort Options -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <span class="text-muted" id="results-count">Showing 0 results</span>
            </div>
            <div>
                <label for="sort-select" class="form-label me-2 mb-0">Sort by:</label>
                <select class="form-select d-inline-block w-auto" id="sort-select">
                    <option value="relevance">Relevance</option>
                    <option value="rating-desc">Highest Rated</option>
                    <option value="rating-asc">Lowest Rated</option>
                    <option value="year-desc">Newest</option>
                    <option value="year-asc">Oldest</option>
                    <option value="title-asc">A-Z</option>
                    <option value="title-desc">Z-A</option>
                </select>
            </div>
        </div>

        <!-- Search Results -->
        <div id="search-results">
            <div class="row" id="search-results-container">
                <!-- Results will be loaded dynamically -->
            </div>
        </div>

        <!-- Pagination -->
        <nav aria-label="Search results pagination" class="mt-4">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- Pagination will be loaded dynamically -->
            </ul>
        </nav>

        <!-- No Results Message -->
        <div id="no-results" class="text-center py-5 d-none">
            <i class="bi bi-search fs-1 text-muted"></i>
            <h3 class="mt-3">No Results Found</h3>
            <p class="text-muted">Try adjusting your search or filters</p>
        </div>
    </div>
</div>
