<div class="album-details-view">
    <div class="container mt-4">
        <!-- Album Header -->
        <div class="row mb-4">
            <div class="col-md-4">
                <img id="album-cover" src="" alt="Album Cover" class="img-fluid rounded shadow-lg">
            </div>
            <div class="col-md-8">
                <h1 id="album-title" class="display-4 fw-bold"></h1>
                <h3 id="album-artist" class="text-muted mb-3"></h3>

                <div class="album-meta mb-3">
                    <span class="badge bg-primary me-2" id="album-genre"></span>
                    <span class="badge bg-secondary me-2" id="album-year"></span>
                    <span class="badge bg-info" id="album-label"></span>
                </div>

                <div class="album-rating mb-4">
                    <div class="d-flex align-items-center">
                        <div class="rating-score me-3">
                            <span class="display-3 fw-bold text-warning" id="album-avg-rating">-</span>
                            <span class="text-muted">/10</span>
                        </div>
                        <div>
                            <div class="stars mb-1" id="album-stars"></div>
                            <p class="text-muted mb-0">
                                <span id="album-rating-count">0</span> ratings
                            </p>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#rateModal">
                        <i class="bi bi-star"></i> Rate this Album
                    </button>
                    <button class="btn btn-outline-secondary btn-lg">
                        <i class="bi bi-heart"></i> Add to Favorites
                    </button>
                </div>
            </div>
        </div>

        <!-- Album Info Tabs -->
        <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="overview-tab" data-bs-toggle="tab"
                        data-bs-target="#overview" type="button" role="tab">
                    Overview
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tracks-tab" data-bs-toggle="tab"
                        data-bs-target="#tracks" type="button" role="tab">
                    Track List
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="reviews-tab" data-bs-toggle="tab"
                        data-bs-target="#reviews" type="button" role="tab">
                    Reviews
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- Overview Tab -->
            <div class="tab-pane fade show active" id="overview" role="tabpanel">
                <div class="card mb-4">
                    <div class="card-body">
                        <h4>About This Album</h4>
                        <p id="album-description" class="lead"></p>
                    </div>
                </div>
            </div>

            <!-- Tracks Tab -->
            <div class="tab-pane fade" id="tracks" role="tabpanel">
                <div class="card">
                    <div class="card-body">
                        <h4 class="mb-3">Track Listing</h4>
                        <div class="list-group" id="track-list">
                            <!-- Tracks will be loaded dynamically -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Reviews Tab -->
            <div class="tab-pane fade" id="reviews" role="tabpanel">
                <div class="mb-4">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#reviewModal">
                        <i class="bi bi-pencil"></i> Write a Review
                    </button>
                </div>
                <div id="reviews-list">
                    <!-- Reviews will be loaded dynamically -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Rate Album Modal -->
<div class="modal fade" id="rateModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Rate This Album</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="rating-form">
                    <div class="text-center mb-4">
                        <h3 class="mb-3">Your Rating</h3>
                        <div class="rating-input">
                            <div class="btn-group" role="group">
                                <input type="radio" class="btn-check" name="rating" id="rating1" value="1">
                                <label class="btn btn-outline-warning" for="rating1">1</label>

                                <input type="radio" class="btn-check" name="rating" id="rating2" value="2">
                                <label class="btn btn-outline-warning" for="rating2">2</label>

                                <input type="radio" class="btn-check" name="rating" id="rating3" value="3">
                                <label class="btn btn-outline-warning" for="rating3">3</label>

                                <input type="radio" class="btn-check" name="rating" id="rating4" value="4">
                                <label class="btn btn-outline-warning" for="rating4">4</label>

                                <input type="radio" class="btn-check" name="rating" id="rating5" value="5">
                                <label class="btn btn-outline-warning" for="rating5">5</label>

                                <input type="radio" class="btn-check" name="rating" id="rating6" value="6">
                                <label class="btn btn-outline-warning" for="rating6">6</label>

                                <input type="radio" class="btn-check" name="rating" id="rating7" value="7">
                                <label class="btn btn-outline-warning" for="rating7">7</label>

                                <input type="radio" class="btn-check" name="rating" id="rating8" value="8">
                                <label class="btn btn-outline-warning" for="rating8">8</label>

                                <input type="radio" class="btn-check" name="rating" id="rating9" value="9">
                                <label class="btn btn-outline-warning" for="rating9">9</label>

                                <input type="radio" class="btn-check" name="rating" id="rating10" value="10">
                                <label class="btn btn-outline-warning" for="rating10">10</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Submit Rating</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Review Modal -->
<div class="modal fade" id="reviewModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Write a Review</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="review-form">
                    <div class="mb-3">
                        <label for="review-title" class="form-label">Review Title</label>
                        <input type="text" class="form-control" id="review-title"
                               placeholder="Sum up your review" required>
                    </div>
                    <div class="mb-3">
                        <label for="review-text" class="form-label">Your Review</label>
                        <textarea class="form-control" id="review-text" rows="5"
                                  placeholder="Share your thoughts about this album..." required></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Post Review</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
