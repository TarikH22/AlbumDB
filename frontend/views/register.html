<div class="register-view">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus-fill fs-1 text-primary"></i>
                            <h2 class="mt-3">Create Account</h2>
                            <p class="text-muted">Join AlbumRate and start rating albums</p>
                        </div>

                        <form id="register-form">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="register-firstname" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="register-firstname"
                                           placeholder="John" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="register-lastname" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="register-lastname"
                                           placeholder="Doe" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="register-username" class="form-label">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-at"></i>
                                    </span>
                                    <input type="text" class="form-control" id="register-username"
                                           placeholder="musiclover123" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="register-email" class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-envelope"></i>
                                    </span>
                                    <input type="email" class="form-control" id="register-email"
                                           placeholder="your@email.com" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="register-password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                    <input type="password" class="form-control" id="register-password"
                                           placeholder="Minimum 8 characters" required minlength="8">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="register-confirm-password" class="form-label">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                    <input type="password" class="form-control" id="register-confirm-password"
                                           placeholder="Re-enter password" required minlength="8">
                                </div>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="terms-agree" required>
                                <label class="form-check-label" for="terms-agree">
                                    I agree to the <a href="#terms">Terms of Service</a> and
                                    <a href="#privacy">Privacy Policy</a>
                                </label>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-person-check"></i> Create Account
                                </button>
                            </div>
                        </form>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="text-muted mb-2">Already have an account?</p>
                            <a href="#login" class="btn btn-outline-primary">
                                Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
