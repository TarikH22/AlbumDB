<div class="profile-view">
    <div class="container mt-4">
        <!-- Profile Header -->
        <div class="row mb-4">
            <div class="col-md-3 text-center">
                <img id="profile-avatar" src="" alt="Profile Picture"
                     class="rounded-circle img-fluid mb-3 shadow"
                     style="width: 200px; height: 200px; object-fit: cover;">
                <button class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-camera"></i> Change Photo
                </button>
            </div>
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h1 id="profile-username" class="display-5 fw-bold"></h1>
                        <p id="profile-fullname" class="text-muted fs-5"></p>
                        <p id="profile-email" class="text-muted">
                            <i class="bi bi-envelope"></i> <span></span>
                        </p>
                    </div>
                    <button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#editProfileModal">
                        <i class="bi bi-pencil"></i> Edit Profile
                    </button>
                </div>

                <!-- User Stats -->
                <div class="row mt-4">
                    <div class="col-md-3 col-6 text-center mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h3 class="fw-bold text-primary" id="stat-ratings">0</h3>
                                <p class="text-muted mb-0">Ratings</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6 text-center mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h3 class="fw-bold text-success" id="stat-reviews">0</h3>
                                <p class="text-muted mb-0">Reviews</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6 text-center mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h3 class="fw-bold text-danger" id="stat-favorites">0</h3>
                                <p class="text-muted mb-0">Favorites</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6 text-center mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h3 class="fw-bold text-warning" id="stat-avg-rating">0.0</h3>
                                <p class="text-muted mb-0">Avg Rating</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Profile Tabs -->
        <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="ratings-tab" data-bs-toggle="tab"
                        data-bs-target="#ratings-content" type="button" role="tab">
                    <i class="bi bi-star"></i> My Ratings
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="reviews-tab" data-bs-toggle="tab"
                        data-bs-target="#reviews-content" type="button" role="tab">
                    <i class="bi bi-chat-left-text"></i> My Reviews
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="favorites-tab" data-bs-toggle="tab"
                        data-bs-target="#favorites-content" type="button" role="tab">
                    <i class="bi bi-heart"></i> Favorites
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- Ratings Tab -->
            <div class="tab-pane fade show active" id="ratings-content" role="tabpanel">
                <div class="row" id="user-ratings-list">
                    <!-- User ratings will be loaded dynamically -->
                </div>
            </div>

            <!-- Reviews Tab -->
            <div class="tab-pane fade" id="reviews-content" role="tabpanel">
                <div id="user-reviews-list">
                    <!-- User reviews will be loaded dynamically -->
                </div>
            </div>

            <!-- Favorites Tab -->
            <div class="tab-pane fade" id="favorites-content" role="tabpanel">
                <div class="row" id="user-favorites-list">
                    <!-- User favorites will be loaded dynamically -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Profile Modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Profile</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="edit-profile-form">
                    <div class="mb-3">
                        <label for="edit-firstname" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="edit-firstname" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit-lastname" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="edit-lastname" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit-username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="edit-username" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit-email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="edit-email" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit-bio" class="form-label">Bio</label>
                        <textarea class="form-control" id="edit-bio" rows="3"
                                  placeholder="Tell us about yourself..."></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
